<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1190" viewBox="0 0 1440 1190" role="img" aria-labelledby="title desc">
<title id="title">Automatic Product Management 아키텍처</title>
<desc id="desc">교체 가능한 입력 채널을 공통 요청으로 변환하고 n8n에서 DB와 AI로 처리한 뒤 출력 어댑터로 전달합니다. Chat과 Slack은 구현 예시이며 외부 채널은 어댑터로 연결합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" /></marker></defs>
<style>text{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;fill:#172554}.title{font-size:32px;font-weight:700}.sub{font-size:18px;fill:#475569}.label{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#475569}.flow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 5}</style>
<rect width="1440" height="1190" rx="20" fill="#f8fafc" />
<text x="60" y="61" class="title">Automatic Product Management</text>
<text x="60" y="96" class="sub">채널은 교체하고, 공통 업무 처리 흐름은 재사용합니다.</text>
